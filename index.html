<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'" />
    <title>Leasing Management</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Properties</h1>
      <button id="add-btn" class="primary">+ Add House</button>
    </header>

    <main>
      <table id="properties-table">
        <thead>
          <tr>
            <th>Address</th>
            <th>City</th>
            <th>State</th>
            <th>Zip</th>
            <th class="num">Beds</th>
            <th class="num">Baths</th>
            <th class="num">Sq ft</th>
            <th class="num">Rent / mo</th>
            <th class="num">Mortgage / mo</th>
            <th class="num">HOA / mo</th>
            <th class="num">Tax / yr</th>
            <th class="num">Insurance / yr</th>
            <th class="num">Repairs</th>
            <th class="num">Net / yr</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="properties-body"></tbody>
        <tfoot id="properties-foot"></tfoot>
      </table>
      <p id="empty-msg" hidden>No properties yet. Click "Add House" to create one.</p>

      <section id="summary" hidden>
        <h2>Yearly Summary</h2>
        <dl id="summary-list"></dl>
      </section>
    </main>

    <dialog id="property-dialog">
      <form id="property-form" method="dialog" novalidate>
        <h2 id="dialog-title">Add House</h2>

        <label>Address <input name="address" type="text" required /></label>
        <div class="row">
          <label>City <input name="city" type="text" required /></label>
          <label>State <input name="state" type="text" maxlength="2" /></label>
          <label>Zip <input name="zip" type="text" /></label>
        </div>
        <div class="row">
          <label>Bedrooms <input name="bedrooms" type="number" min="0" step="1" value="0" /></label>
          <label>Bathrooms <input name="bathrooms" type="number" min="0" step="0.5" value="0" /></label>
          <label>Sq ft <input name="sqft" type="number" min="0" step="1" value="0" /></label>
        </div>
        <div class="row">
          <label>Monthly rent ($) <input name="monthlyRent" type="number" min="0" step="0.01" value="0" /></label>
          <label>Monthly mortgage ($) <input name="mortgage" type="number" min="0" step="0.01" value="0" /></label>
        </div>
        <div class="row">
          <label>HOA fee ($/month) <input name="hoaFee" type="number" min="0" step="0.01" value="0" /></label>
          <label>Property tax ($/year) <input name="propertyTax" type="number" min="0" step="0.01" value="0" /></label>
        </div>
        <p class="hint">Optional costs (leave blank if not applicable)</p>
        <div class="row">
          <label>Insurance ($/year) <input name="insurance" type="number" min="0" step="0.01" /></label>
          <label>Repair cost ($) <input name="repairCost" type="number" min="0" step="0.01" /></label>
        </div>

        <p id="form-error" class="error" hidden></p>

        <div class="actions">
          <button type="button" id="cancel-btn">Cancel</button>
          <button type="submit" class="primary">Save</button>
        </div>
      </form>
    </dialog>

    <script src="renderer.js"></script>
  </body>
</html>
